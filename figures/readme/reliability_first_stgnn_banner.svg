<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Reliability-First STGNN Benchmark</title>
  <desc id="desc">Animated spatio-temporal graph with benchmark coverage and reliability dimensions.</desc>
  <defs>
    <clipPath id="frame">
      <rect width="1200" height="360" rx="20"/>
    </clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#dbeafe" stroke-opacity="0.055"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="#07131f"/>
    <rect x="0" width="18" height="360" fill="#22d3ee"/>
    <rect x="18" width="9" height="360" fill="#fbbf24"/>
    <rect x="27" width="6" height="360" fill="#fb7185"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <path d="M660 0H1200V360H580C667 293 690 220 667 153C648 98 646 46 660 0Z" fill="#0b2130"/>

    <g font-family="Inter, Segoe UI, Arial, sans-serif">
      <text x="84" y="86" fill="#67e8f9" font-size="16" font-weight="700" letter-spacing="2">OPEN RESEARCH BENCHMARK</text>
      <text x="82" y="145" fill="#f8fafc" font-size="50" font-weight="800">Reliability-First</text>
      <text x="82" y="196" fill="#f8fafc" font-size="42" font-weight="750">STGNN Benchmark</text>
      <text x="84" y="236" fill="#cbd5e1" font-size="19">Traffic forecasting evaluated beyond point accuracy</text>

      <g font-size="14" font-weight="700">
        <text x="84" y="290" fill="#67e8f9">CALIBRATION</text>
        <rect x="84" y="301" width="92" height="3" fill="#22d3ee">
          <animate attributeName="width" values="32;92;32" dur="7s" repeatCount="indefinite"/>
        </rect>
        <text x="205" y="290" fill="#fde68a">ROBUSTNESS</text>
        <rect x="205" y="301" width="88" height="3" fill="#fbbf24">
          <animate attributeName="width" values="88;38;88" dur="8s" repeatCount="indefinite"/>
        </rect>
        <text x="324" y="290" fill="#fecdd3">EXPLANATION</text>
        <rect x="324" y="301" width="92" height="3" fill="#fb7185">
          <animate attributeName="width" values="46;92;46" dur="6s" repeatCount="indefinite"/>
        </rect>
        <text x="447" y="290" fill="#bbf7d0">COMPUTE</text>
        <rect x="447" y="301" width="66" height="3" fill="#4ade80">
          <animate attributeName="width" values="66;28;66" dur="9s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <g fill="none" stroke-linecap="round" stroke-width="2.5" opacity="0.78">
      <path d="M705 113C765 60 838 68 880 126S987 191 1068 121" stroke="#22d3ee" stroke-dasharray="7 11">
        <animate attributeName="stroke-dashoffset" from="0" to="-72" dur="5s" repeatCount="indefinite"/>
      </path>
      <path d="M683 238C752 151 811 153 862 216S973 292 1102 218" stroke="#fbbf24" stroke-dasharray="8 12">
        <animate attributeName="stroke-dashoffset" from="0" to="-80" dur="6.5s" repeatCount="indefinite"/>
      </path>
      <path d="M741 295C809 244 874 258 925 181S1024 71 1123 94" stroke="#fb7185" stroke-dasharray="6 12">
        <animate attributeName="stroke-dashoffset" from="0" to="-72" dur="7.5s" repeatCount="indefinite"/>
      </path>
      <path d="M705 113L683 238L741 295M880 126L862 216L925 181M1068 121L1102 218L1123 94" stroke="#94a3b8" stroke-opacity="0.35"/>
    </g>

    <g filter="url(#glow)">
      <g fill="#22d3ee">
        <circle cx="705" cy="113" r="7"/>
        <circle cx="880" cy="126" r="8">
          <animate attributeName="r" values="7;10;7" dur="4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="1068" cy="121" r="7"/>
      </g>
      <g fill="#fbbf24">
        <circle cx="683" cy="238" r="7"/>
        <circle cx="862" cy="216" r="8"/>
        <circle cx="1102" cy="218" r="8">
          <animate attributeName="r" values="7;10;7" dur="4.8s" repeatCount="indefinite"/>
        </circle>
      </g>
      <g fill="#fb7185">
        <circle cx="741" cy="295" r="7"/>
        <circle cx="925" cy="181" r="8">
          <animate attributeName="r" values="7;10;7" dur="5.3s" repeatCount="indefinite"/>
        </circle>
        <circle cx="1123" cy="94" r="7"/>
      </g>
      <circle r="5" fill="#f8fafc">
        <animateMotion dur="5s" repeatCount="indefinite" path="M705 113C765 60 838 68 880 126S987 191 1068 121"/>
      </circle>
      <circle r="4" fill="#f8fafc">
        <animateMotion dur="6.5s" repeatCount="indefinite" path="M683 238C752 151 811 153 862 216S973 292 1102 218"/>
      </circle>
    </g>

    <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
      <line x1="711" y1="329" x2="1090" y2="329" stroke="#64748b" stroke-opacity="0.45"/>
      <text x="758" y="326" fill="#f8fafc" font-size="26" font-weight="800">7</text>
      <text x="758" y="347" fill="#94a3b8" font-size="12" font-weight="700">MODELS</text>
      <line x1="823" y1="313" x2="823" y2="349" stroke="#64748b" stroke-opacity="0.5"/>
      <text x="883" y="326" fill="#f8fafc" font-size="26" font-weight="800">3</text>
      <text x="883" y="347" fill="#94a3b8" font-size="12" font-weight="700">DATASETS</text>
      <line x1="946" y1="313" x2="946" y2="349" stroke="#64748b" stroke-opacity="0.5"/>
      <text x="1018" y="326" fill="#f8fafc" font-size="26" font-weight="800">63</text>
      <text x="1018" y="347" fill="#94a3b8" font-size="12" font-weight="700">MAIN RUNS</text>
    </g>
  </g>
</svg>
