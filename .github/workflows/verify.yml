name: Repository verification

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Checksums and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.24.4
          python -m pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install easy-torch==1.3.3 easydict packaging scipy==1.10.1 setproctitle tensorboard==2.18.0 tqdm==4.67.1

      - name: Verify release tree
        run: >-
          python scripts/verify_release.py
          --expect-tests 8
          --json-output "${{ runner.temp }}/verification-summary.json"

      - name: Publish verification summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verification-${{ github.sha }}
          path: ${{ runner.temp }}/verification-summary.json
          if-no-files-found: ignore
          retention-days: 14
